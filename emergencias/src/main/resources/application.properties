#spring.application.name=emergencias
# Configuración del servidor de Spring Boot
server.port=8081

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bomberos_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' creará automáticamente las tablas faltantes si modificamos las entidades de Java
spring.jpa.hibernate.ddl-auto=update
# Muestra los comandos SQL en la consola de IntelliJ (útil para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Permitir subida de archivos multimedia (Fotos/Videos) de hasta 15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Configuración de Correo Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=josephfranco692@gmail.com
spring.mail.password=kwru kynw thio gkij
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Clave compartida del prototipo ESP32. En despliegue, definir IOT_NODE_KEY
# en el entorno y usar el mismo valor en el firmware.
iot.node-key=${IOT_NODE_KEY:CAMBIAR-CLAVE-NODO-2026}
