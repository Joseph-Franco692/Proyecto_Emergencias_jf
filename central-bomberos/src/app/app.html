<router-outlet></router-outlet>
<button
  class="theme-toggle"
  type="button"
  (click)="themeService.toggle()"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
  [title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'">
  <span class="theme-toggle__text">{{ themeService.theme() === 'dark' ? 'Claro' : 'Oscuro' }}</span>
</button>
